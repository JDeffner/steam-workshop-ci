# Reusable CI for a Steam Workshop item kept in a git repository.
#
# Every pull request validates the shipping tree and the Workshop metadata.
# A push to the default branch publishes to the Steam Workshop, but only when
# the version line in the version file differs from the previous commit.
# Bumping the version is therefore the release action; everything else merges
# freely. A push that leaves the version alone but touches workshop/ sends a
# listing update instead: title and description only, no content, no change
# note. A workflow_dispatch from the caller forces that same listing update.
#
# Two manifest fields are deliberately never written:
#
#   `tags`       Steam's build manifest has no field for them, so existing
#                Workshop tags survive an update untouched.
#   `visibility` The manifest only understands public/friends/private and has
#                no value for "unlisted", so writing it could flip an unlisted
#                item public.
#
# The change note comes from CHANGELOG.md: the section whose heading carries
# the new version, converted from Markdown to BBCode. A release whose version
# has no section fails validation. After a successful release the same section
# is announced on Discord, when DISCORD_WEBHOOK_URL is set.
#
# Localized listings in workshop/<language>/ are validated but never uploaded.
# Steam offers no headless way to set them (see the README).
name: Steam Workshop CI

on:
  workflow_call:
    inputs:
      app_id:
        description: Steam AppID that owns the Workshop item. Crusader Kings III is 1158310.
        type: string
        default: "1158310"
      content_dir:
        description: Folder uploaded to the Workshop, verbatim.
        type: string
        default: mod
      preview_file:
        description: Preview image, 1 MB maximum.
        type: string
        default: mod/thumbnail.png
      version_file:
        description: File carrying the version line that decides a release.
        type: string
        default: mod/descriptor.mod
      version_pattern:
        description: Regex whose first group is the version, matched multiline against version_file.
        type: string
        default: '^version="(.*)"'
    secrets:
      STEAM_USERNAME:
        required: false
      STEAM_CONFIG_VDF:
        required: false
      DISCORD_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      version: ${{ steps.decide.outputs.version }}
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Check the shipping tree
        env:
          CONTENT_DIR: ${{ inputs.content_dir }}
          PREVIEW_FILE: ${{ inputs.preview_file }}
          VERSION_FILE: ${{ inputs.version_file }}
        run: |
          set -uo pipefail
          fail=0
          block() { echo "::error::$1"; fail=1; }

          [ -d "$CONTENT_DIR" ] || block "no $CONTENT_DIR/ directory"
          [ -f "$VERSION_FILE" ] || block "$VERSION_FILE is missing"
          [ -f "$PREVIEW_FILE" ] || block "$PREVIEW_FILE is missing"

          # Steam rejects preview images over 1 MB.
          if [ -f "$PREVIEW_FILE" ]; then
            size=$(stat -c%s "$PREVIEW_FILE")
            [ "$size" -le 1048576 ] || block "$PREVIEW_FILE is $size bytes, Steam's limit is 1048576"
          fi

          # The Workshop ships the content folder verbatim, so nothing extra may live in it.
          if [ -d "$CONTENT_DIR" ]; then
            find "$CONTENT_DIR" -name '__pycache__' -o -name '*.pyc' | grep -q . && block "python bytecode inside $CONTENT_DIR/"
            [ -e "$CONTENT_DIR/.claude" ] && block "$CONTENT_DIR/.claude would ship"
            [ -d "$CONTENT_DIR/.git" ] && block "$CONTENT_DIR/.git is a real directory, its whole history would ship"
          fi

          [ -f workshop/item.json ] || block "workshop/item.json is missing"
          [ -f workshop/description.bbcode ] || block "workshop/description.bbcode is missing"

          exit $fail

      - name: Check the Workshop metadata
        env:
          VERSION_FILE: ${{ inputs.version_file }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const item = JSON.parse(fs.readFileSync("workshop/item.json", "utf8"));
          const desc = fs.readFileSync("workshop/description.bbcode", "utf8");
          const errors = [];

          if (!item.title) errors.push("workshop/item.json has no title");
          else if (item.title.length > 128) errors.push(`title is ${item.title.length} chars, Steam allows 128`);
          if (desc.length > 8000) errors.push(`description is ${desc.length} chars, Steam allows 8000`);

          // Steam API language codes. The folders are never uploaded, they are
          // the source you paste into the Workshop UI, but a typo in the code
          // would make that pairing wrong, so the set is still checked.
          const languages = [
            "arabic", "bulgarian", "schinese", "tchinese", "czech", "danish", "dutch", "english",
            "finnish", "french", "german", "greek", "hungarian", "indonesian", "italian", "japanese",
            "koreana", "norwegian", "polish", "portuguese", "brazilian", "romanian", "russian",
            "spanish", "latam", "swedish", "thai", "turkish", "ukrainian", "vietnamese",
          ];
          const found = [];
          for (const entry of fs.readdirSync("workshop", { withFileTypes: true })) {
            if (!entry.isDirectory()) continue;
            const lang = entry.name, dir = `workshop/${lang}`;
            if (!languages.includes(lang)) { errors.push(`${dir}/ is not a Steam language code`); continue; }
            if (!fs.existsSync(`${dir}/title.txt`)) errors.push(`${dir}/title.txt is missing`);
            else if (fs.readFileSync(`${dir}/title.txt`, "utf8").trim().length > 128) errors.push(`${dir}/title.txt is over 128 chars`);
            if (!fs.existsSync(`${dir}/description.bbcode`)) errors.push(`${dir}/description.bbcode is missing`);
            else if (fs.readFileSync(`${dir}/description.bbcode`, "utf8").length > 8000) errors.push(`${dir}/description.bbcode is over 8000 chars`);
            found.push(lang);
          }

          const id = String(item.publishedfileid || "");
          if (!/^[0-9]+$/.test(id)) errors.push("workshop/item.json has no numeric publishedfileid");

          // Paradox descriptors carry the same id a second time. Cross-check it
          // when it is there, and say nothing when it is not.
          const versionFile = fs.readFileSync(process.env.VERSION_FILE, "utf8");
          const mirrored = (versionFile.match(/^remote_file_id="([0-9]+)"/m) || [])[1];
          if (mirrored && mirrored !== id) {
            errors.push(`item.json publishedfileid ${id} disagrees with ${process.env.VERSION_FILE} ${mirrored}`);
          }

          for (const e of errors) console.log("::error::" + e);
          if (errors.length) process.exit(1);
          console.log(`ok: "${item.title}", item ${id}, ${desc.length} chars of description, localized: ${found.join(" ") || "none"}`);
          NODE

      - name: Decide whether this is a release, a listing update, or neither
        id: decide
        env:
          VERSION_FILE: ${{ inputs.version_file }}
          VERSION_PATTERN: ${{ inputs.version_pattern }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");
          const git = (args) => { try { return execFileSync("git", args, { encoding: "utf8" }); } catch { return ""; } };
          const file = process.env.VERSION_FILE;
          const re = new RegExp(process.env.VERSION_PATTERN, "m");
          const value = (text) => (text && (text.match(re) || [])[1]) || "";

          const now = value(fs.readFileSync(file, "utf8"));
          const before = value(git(["show", `HEAD^:${file}`]));
          if (!now) { console.log(`::error::${file} has no line matching ${re}`); process.exit(1); }
          const listingTouched = git(["diff", "--name-only", "HEAD^", "HEAD", "--", "workshop"]).trim() !== "";

          let mode = "none";
          if (process.env.EVENT_NAME === "workflow_dispatch") {
            mode = "listing";
            console.log("Manual run: updating the listing only.");
          } else if (process.env.EVENT_NAME !== "push") {
            console.log("Not a push: validation only.");
          } else if (now !== before) {
            mode = "release";
            console.log(`Version went ${before || "none"} -> ${now}, publishing.`);
          } else if (listingTouched) {
            mode = "listing";
            console.log(`Version is still ${now} but workshop/ changed: updating the listing only.`);
          } else {
            console.log(`Version is still ${now}, so nothing is published.`);
          }
          // `changed` is the version test on its own, event aside, so a pull
          // request that bumps the version still has its changelog checked.
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${now}\nmode=${mode}\nchanged=${now !== before}\n`);
          NODE

      # Only a version bump needs a changelog entry. Everything else merges
      # without touching CHANGELOG.md.
      - name: Check the changelog
        if: steps.decide.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const version = process.env.VERSION;
          if (!fs.existsSync("CHANGELOG.md")) {
            console.log(`::error::the version changed to ${version} but there is no CHANGELOG.md`);
            process.exit(1);
          }
          // A section runs from `## <version>` (anything after the version on
          // that line, a date say, is ignored) to the next `## ` or the end.
          const section = (text, want) => {
            let body = null;
            for (const line of text.replace(/\r\n/g, "\n").split("\n")) {
              const head = line.match(/^## (\S+)/);
              if (head) {
                if (body) break;
                if (head[1] === want) body = [];
                continue;
              }
              if (body) body.push(line);
            }
            return body ? body.join("\n").trim() : null;
          };
          const body = section(fs.readFileSync("CHANGELOG.md", "utf8"), version);
          if (body === null) {
            console.log(`::error::CHANGELOG.md has no "## ${version}" section, so release ${version} has no change note`);
            process.exit(1);
          }
          if (!body) {
            console.log(`::error::the "## ${version}" section of CHANGELOG.md is empty`);
            process.exit(1);
          }
          console.log(`ok: CHANGELOG.md describes ${version} in ${body.length} chars`);
          NODE

  publish:
    needs: validate
    if: needs.validate.outputs.mode != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check the Steam credentials exist
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          if [ -z "$STEAM_USERNAME" ] || [ -z "$STEAM_CONFIG_VDF" ]; then
            echo "::error::STEAM_USERNAME and STEAM_CONFIG_VDF are not set on this repository. See the ck3-mod-ci README."
            exit 1
          fi

      - name: Install SteamCMD
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq lib32gcc-s1 >/dev/null
          mkdir -p ~/steamcmd
          curl -sqL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar zxf - -C ~/steamcmd

      - name: Restore the Steam session
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          set -euo pipefail
          mkdir -p ~/Steam/config
          printf '%s' "$STEAM_CONFIG_VDF" | base64 -d > ~/Steam/config/config.vdf
          test -s ~/Steam/config/config.vdf

      - name: Build the Workshop manifest
        env:
          APP_ID: ${{ inputs.app_id }}
          CONTENT_DIR: ${{ inputs.content_dir }}
          PREVIEW_FILE: ${{ inputs.preview_file }}
          VERSION: ${{ needs.validate.outputs.version }}
          MODE: ${{ needs.validate.outputs.mode }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const version = process.env.VERSION;
          const release = process.env.MODE === "release";

          // The change note is the CHANGELOG.md section for this version.
          // Validation has already refused a release without one, so this only
          // runs when the section is there.
          const section = (text, want) => {
            let body = null;
            for (const line of text.replace(/\r\n/g, "\n").split("\n")) {
              const head = line.match(/^## (\S+)/);
              if (head) {
                if (body) break;
                if (head[1] === want) body = [];
                continue;
              }
              if (body) body.push(line);
            }
            return body ? body.join("\n").trim() : "";
          };

          // Markdown to BBCode, deliberately small: bold, italic, links, code
          // spans stripped of their backticks, `###` subsections as bold lines
          // and each run of bullets as one [list].
          const inline = (s) => s
            .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, "[url=$2]$1[/url]")
            .replace(/\*\*([^*]+)\*\*/g, "[b]$1[/b]")
            .replace(/(?<![\w*])\*([^*]+)\*(?![\w*])/g, "[i]$1[/i]")
            .replace(/(?<![\w_])_([^_]+)_(?![\w_])/g, "[i]$1[/i]")
            .replace(/`([^`]+)`/g, "$1");

          const bbcode = (markdown) => {
            const out = [];
            let list = null;
            const flush = () => { if (list) { out.push("[list]", ...list, "[/list]"); list = null; } };
            for (const raw of markdown.split("\n")) {
              const line = raw.trimEnd();
              const bullet = line.match(/^\s*[-*] +(.*)$/);
              if (bullet) { (list = list || []).push(`[*]${inline(bullet[1])}`); continue; }
              flush();
              const head = line.match(/^#{1,6} +(.*)$/);
              if (head) { out.push(`[b]${inline(head[1])}[/b]`); continue; }
              if (!line.trim()) { if (out.length && out[out.length - 1] !== "") out.push(""); continue; }
              out.push(inline(line));
            }
            flush();
            return out.join("\n").trim();
          };

          let changenote = `v${version}`;
          if (release) {
            const markdown = section(fs.readFileSync("CHANGELOG.md", "utf8"), version);
            fs.writeFileSync("changelog-section.md", markdown);
            changenote = `${changenote}\n${bbcode(markdown)}`.trim();
            fs.writeFileSync("changenote.bbcode", changenote);
          }

          // SteamCMD does NOT process escape sequences in workshop_build_item:
          // a `\n` written into the manifest reaches the Workshop as those two
          // characters. So newlines go in raw and backslashes stay as they are.
          // A double quote would end the value and cannot be escaped either,
          // so quotes become typographic ones, opening and closing by turns.
          const quotes = (s) => { let n = 0; return String(s).replace(/"/g, () => (n++ % 2 ? "”" : "“")); };

          const item = JSON.parse(fs.readFileSync("workshop/item.json", "utf8"));
          const description = quotes(fs.readFileSync("workshop/description.bbcode", "utf8").replace(/\r\n/g, "\n").trimEnd());
          const title = quotes(item.title);
          const id = String(item.publishedfileid);

          // A listing update carries no content and no change note, so Steam
          // records no new update entry: only title and description change.
          const fields = {
            appid: process.env.APP_ID,
            publishedfileid: id,
            ...(release ? {
              contentfolder: path.resolve(process.env.CONTENT_DIR),
              previewfile: path.resolve(process.env.PREVIEW_FILE),
            } : {}),
            title: title,
            description: description,
            ...(release ? { changenote: quotes(changenote).slice(0, 8000) } : {}),
          };

          const body = Object.entries(fields).map(([k, v]) => `\t"${k}"\t"${v}"`).join("\n");
          fs.writeFileSync("item.vdf", `"workshopitem"\n{\n${body}\n}\n`);
          fs.writeFileSync("expected-description.txt", description);
          console.log(`${release ? "release" : "listing update"}: item ${id}, "${title}", ${description.length} chars of description${release ? `, ${changenote.length} chars of change note` : ""}`);
          NODE

      - name: Upload to the Steam Workshop
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          set -uo pipefail
          ~/steamcmd/steamcmd.sh +login "$STEAM_USERNAME" +workshop_build_item "$PWD/item.vdf" +quit | tee steamcmd.log
          if ! grep -q "Success" steamcmd.log; then
            echo "::error::SteamCMD did not report success. If it asked for a Steam Guard code, the STEAM_CONFIG_VDF session has expired and needs re-priming."
            exit 1
          fi

      # The release is already out, so nothing here may fail the job. Discord
      # renders Markdown, so the announcement carries the changelog section as
      # it is written, with only the `###` subsection headings made bold.
      - name: Announce the release on Discord
        if: needs.validate.outputs.mode == 'release'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const webhook = process.env.DISCORD_WEBHOOK_URL || "";
          (async () => {
            if (!webhook) {
              console.log("::notice::DISCORD_WEBHOOK_URL is not set, so the release was not announced.");
              return;
            }
            const item = JSON.parse(fs.readFileSync("workshop/item.json", "utf8"));
            const id = String(item.publishedfileid);
            let body = fs.readFileSync("changelog-section.md", "utf8").replace(/^#{1,6} +(.*)$/gm, "**$1**").trim();
            if (body.length > 4000) body = body.slice(0, 3999) + "…";
            const payload = {
              embeds: [{
                title: `${item.title} v${process.env.VERSION}`,
                url: `https://steamcommunity.com/sharedfiles/filedetails/?id=${id}`,
                description: body,
                color: 3447003,
              }],
            };
            try {
              const res = await fetch(webhook, {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(payload),
              });
              if (res.ok) console.log(`Announced ${item.title} v${process.env.VERSION} on Discord.`);
              else console.log(`::warning::Discord answered ${res.status}, so the release was not announced.`);
            } catch {
              console.log("::warning::The Discord webhook could not be reached, so the release was not announced.");
            }
          })();
          NODE

      # Best effort. Steam only serves details for publicly readable items, so a
      # hidden or unlisted item simply skips the comparison.
      - name: Verify the published listing
        continue-on-error: true
        run: |
          sleep 15
          node <<'NODE'
          const fs = require("fs");
          const id = String(JSON.parse(fs.readFileSync("workshop/item.json", "utf8")).publishedfileid);
          (async () => {
            const body = new URLSearchParams({ itemcount: "1", "publishedfileids[0]": id });
            const res = await fetch("https://api.steampowered.com/ISteamRemoteStorage/GetPublishedFileDetails/v1/", { method: "POST", body });
            const detail = (await res.json()).response.publishedfiledetails[0];
            if (detail.result !== 1) {
              console.log(`::notice::item ${id} is not publicly readable (result ${detail.result}), so the description was not verified`);
              return;
            }
            const want = fs.readFileSync("expected-description.txt", "utf8");
            const got = (detail.description || "").replace(/\r\n/g, "\n").trimEnd();
            if (got === want) console.log("The published description matches workshop/description.bbcode.");
            else console.log("::warning::The published description does not match workshop/description.bbcode. Check how newlines and quotes survived the upload.");
          })();
          NODE
